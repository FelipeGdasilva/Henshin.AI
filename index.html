<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Henshin.AI - Encontre o anime perfeito para você</title>

    <link rel="stylesheet" href="src/css/variaveis.css" />
    <link rel="stylesheet" href="src/css/reset.css" />
    <link rel="stylesheet" href="src/css/styles.css" />
    <link rel="stylesheet" href="src/css/animations.css" />
    <link rel="stylesheet" href="src/css/responsivo.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@100;200;300;400;500;600;700;800;900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  </head>

  <body>
    <img 
      src="src/images/Henshin.Ai-Asa.png" 
      alt="Henshin AI Assistente" 
      class="assistant-fixed"
    >

    <div class="bg"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>

    <main class="container">
      <div class="main-content">
        
        <header class="brand-header">
          <h1 class="brand-title">Henshin<span class="ai-suffix">.AI</span></h1>
          <p class="brand-subtitle">
            Seu assistente pessoal para encontrar o anime perfeito
          </p>
        </header>

        <div class="search-card">
          <div class="search-content">
            <div class="input-container">
            <div class="scan-line"></div> <div class="search-content"></div>
              <textarea
                id="mood-input"
                rows="3"
                placeholder="Descreva o anime que você quer assistir ou como está se sentindo..."
                class="mood-input"
              ></textarea>
            </div>

            <div class="examples">
              <p class="examples-title">Exemplos:</p>
              <ul class="examples-list">
                <li>• Quero um anime de ação com lutas épicas</li>
                <li>• Algo triste que faça chorar</li>
                <li>• Um anime leve para relaxar depois do trabalho</li>
              </ul>
            </div>

            <button id="search-button" class="search-button" disabled>
              <span class="play-icon">▶</span>
              Encontrar Animes
            </button>
          </div>
        </div>

        <div id="results">
          <h2>Animes recomendados pra você</h2>
          <div id="movies-grid" class="movies-grid"></div>
        </div>
      </div>
    </main>

    <script src="src/js/index.js"></script>
  </body>
</html>
